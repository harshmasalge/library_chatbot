name: DevSecOps Security Scans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scans:
    name: Run SAST, Dependency, and Secrets Scans
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for secret scanner to check all commit history

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: 1. Secrets Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

    - name: 2. SAST - Static Application Security Testing (Bandit)
      # Bandit scans Python code for security flaws
      run: bandit -r . -c .bandit

    - name: 3. Dependency Scanning (Safety)
      # Safety scans requirements.txt for known vulnerabilities
      run: safety check -r requirements.txt
